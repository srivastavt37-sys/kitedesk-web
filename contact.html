<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Contact — KiteDesk</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="styles.css" />
  <link rel="icon" type="image/jpeg" href="images/logo.jpg" />
</head>
<body>
  <header class="site-header">
    <div class="container nav-wrap">
      <a href="index.html" class="brand">
        <img src="images/logo.jpg" alt="KiteDesk Logo" class="brand-logo" />
        <span class="brand-name">KiteDesk</span>
      </a>
      <button class="nav-toggle" aria-label="Toggle navigation" onclick="toggleNav()">&#9776;</button>
      <nav class="site-nav" id="siteNav">
        <a href="index.html">Home</a>
        <a href="tools.html">Digital Tools</a>
        <a href="journal.html">Daily Journal</a>
        <a href="about.html">About</a>
        <a href="contact.html" class="nav-cta">Contact</a>
      </nav>
    </div>
  </header>
  <main class="section">
    <div class="container narrow-container">
      <div class="page-intro">
        <span class="eyebrow">Get in Touch</span>
        <h1>Request a free tool or report an issue</h1>
        <p class="lead">Have an idea for a calculator, template, or daily guide? Send us a note.</p>
      </div>
      <form class="card form-card" onsubmit="handleContact(event)">
        <label>Your Name <input type="text" required placeholder="Your name" /></label>
        <label>Email Address <input type="email" required placeholder="you@example.com" /></label>
        <label>Topic
          <select>
            <option>Request a new digital tool</option>
            <option>Report a bug</option>
            <option>Advertising / Sponsorship</option>
          </select>
        </label>
        <label>Message <textarea rows="4" required placeholder="Tell us what you'd like to see on KiteDesk..."></textarea></label>
        <button type="submit" class="btn btn-primary">Send Message</button>
        <p id="contactStatus" class="status-msg"></p>
      </form>
    </div>
  </main>
  <footer class="site-footer"><div class="container footer-bottom"><span>&copy; 2026 KiteDesk &bull; <a href="privacy.html">Privacy</a> &bull; <a href="terms.html">Terms</a></span></div></footer>
  <script src="app.js"></script>
</body>
</html>
